services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: auma_dev_frontend
    working_dir: /app
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: auma_dev_backend
    working_dir: /app
    volumes:
      - ./src/backend:/app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      TEST_DB_HOST: db_test
      TEST_DB_PORT: 5432
      TEST_DB_NAME: auma_test
      TEST_DB_USER: auma
      TEST_DB_PASSWORD: auma_test_password

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      REGISTRATION_VERIFICATION_URL: ${REGISTRATION_VERIFICATION_URL}

    depends_on:
      - db
      - db_test
      - mailpit

  db:
    image: postgres:17
    container_name: auma_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db_test:
    image: postgres:17
    container_name: auma_dev_db_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: auma
      POSTGRES_PASSWORD: auma_test_password
      POSTGRES_DB: auma_test

  mailpit:
    image: axllent/mailpit:latest
    container_name: auma_dev_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  nginx:
    image: nginx:1.28-alpine
    container_name: auma_dev_nginx
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data: